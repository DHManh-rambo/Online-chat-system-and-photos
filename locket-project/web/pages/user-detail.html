<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết tài khoản</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
    <header>
        <h1>Locket Admin · Chi tiết</h1>
        <a href="users.html"><button class="gray">← Danh sách</button></a>
    </header>
    <main>
        <div class="card">
            <p class="msg" id="msg"></p>
            <div id="avatar" style="margin-bottom:12px"></div>
            <dl class="detail" id="info"></dl>
            <div class="row">
                <button id="bEmail">Gửi email đặt lại mật khẩu</button>
                <button id="bPass" class="gray">Đổi mật khẩu</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { requireAdmin } from "../assets/js/auth.js";
        import { api, esc } from "../assets/js/api.js";

        const $ = (id) => document.getElementById(id);
        const uid = new URLSearchParams(location.search).get("uid");
        const STATUS_TEXT = { pending: "Chờ xác thực", active: "Hoạt động", locked: "Bị khóa" };
        const yn = (b) => (b === null || b === undefined ? "—" : b ? "Có" : "Không");
        const when = (iso) => (iso ? new Date(iso).toLocaleString("vi-VN") : "—");
        let user = null;

        async function load() {
            try {
                user = (await api(`/users/${encodeURIComponent(uid)}`)).data;

                // Avatar: chưa có ảnh thì hiện chữ cái đầu
                const initial = (user.fullName.trim().split(/\s+/).pop() || "?")[0].toUpperCase();
                $("avatar").innerHTML = user.avatarUrl
                    ? `<img src="${esc(user.avatarUrl)}" alt="avatar" width="72" height="72" style="border-radius:50%;object-fit:cover">`
                    : `<div style="width:72px;height:72px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700">${esc(initial)}</div>`;

                const rows = [
                    ["UID", user.uid],
                    ["Họ tên", user.fullName],
                    ["Email", user.email],
                    ["Email đã xác thực", yn(user.emailVerified)],
                    ["Số điện thoại", user.phone || "—"],
                    ["Ngày sinh", user.dateOfBirth ? user.dateOfBirth.split("-").reverse().join("/") : "—"],
                    ["Quyền (Firestore)", user.role],
                    ["Claim admin (Auth)", yn(user.isAdminClaim)],
                    ["Trạng thái (Firestore)", STATUS_TEXT[user.status] || user.status],
                    ["Bị vô hiệu hóa (Auth)", yn(user.authDisabled)],
                    ["Ngày tạo", when(user.createdAt)],
                    ["Cập nhật lần cuối", when(user.updatedAt)],
                ];
                $("info").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
            } catch (err) { $("msg").textContent = err.message; }
        }

        async function run(fn, okText) {
            $("msg").style.color = "#dc2626";
            try { await fn(); $("msg").style.color = "#16a34a"; $("msg").textContent = okText; load(); }
            catch (err) { $("msg").textContent = err.message; }
        }

        $("bEmail").onclick = () => confirm(`Gửi email đặt lại mật khẩu tới ${user.email}?`) &&
            run(() => api(`/users/${uid}/reset-email`, { method: "POST" }), "Đã gửi email");

        $("bPass").onclick = () => {
            const p = prompt("Nhập mật khẩu mới (tối thiểu 6 ký tự):");
            if (p) run(() => api(`/users/${uid}/password`, { method: "POST", body: { newPassword: p } }), "Đã đổi mật khẩu");
        };

        if (await requireAdmin()) load();
    </script>
</body>

</html>
