<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý người dùng</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/navbar.css" />
    <link rel="stylesheet" href="../assets/css/user.css" />
</head>

<body>
    <nav class="navbar">
        <div class="navbar-brand">Locket Admin</div>
        <div class="navbar-menu">
            <a href="dashboard.html">Trang chủ</a>
            <a href="user.html" class="active">Người dùng</a>
        </div>
        <button class="navbar-logout" id="logout">Đăng xuất</button>
    </nav>

    <main>
        <div class="card">
            <div class="toolbar">
                <input id="search" placeholder="Tìm theo tên, email, SĐT..." />
                <select id="fltStatus">
                    <option value="">Mọi trạng thái</option>
                    <option value="active">Hoạt động</option>
                    <option value="pending">Chờ xác thực</option>
                    <option value="locked">Bị khóa</option>
                </select>
                <select id="fltRole">
                    <option value="">Mọi quyền</option>
                    <option value="customer">customer</option>
                    <option value="admin">admin</option>
                </select>
                <button id="btnSearch">Tìm</button>
                <button class="green" id="btnAdd">+ Thêm</button>
            </div>

            <p class="msg" id="msg"></p>

            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>SĐT</th>
                            <th>Quyền</th>
                            <th>Trạng thái</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>

            <div class="pager">
                <button class="gray sm" id="prev">Trước</button>
                <span id="pageInfo"></span>
                <button class="gray sm" id="next">Sau</button>
            </div>
        </div>
    </main>

    <!-- DIALOG THÊM / SỬA -->
    <dialog id="dlg">
        <h3 id="dlgTitle"></h3>
        <form id="form">
            <label>Họ và tên</label><input id="fName" required />
            <label>Email</label><input id="fEmail" type="email" required />
            <label>Số điện thoại</label><input id="fPhone" placeholder="0912345678" />
            <label>Ngày sinh</label><input id="fDob" type="date" />

            <div id="createOnly">
                <label>Mật khẩu (tối thiểu 6 ký tự)</label>
                <input id="fPass" type="password" minlength="6" />
                <label>Quyền</label>
                <select id="fRole">
                    <option value="customer">customer</option>
                    <option value="admin">admin</option>
                </select>
            </div>

            <p class="msg" id="fMsg"></p>
            <div class="row">
                <button>Lưu</button>
                <button type="button" class="gray" id="btnCancel">Hủy</button>
            </div>
        </form>
    </dialog>

    <!-- DIALOG CHI TIẾT -->
    <dialog id="detailDlg">
        <h3>Chi tiết tài khoản</h3>
        <div id="detailAvatar" style="margin-bottom:12px"></div>
        <dl class="detail" id="detailInfo"></dl>
        <p class="msg" id="detailMsg"></p>
        <div class="row">
            <button type="button" id="btnSendReset">Gửi email đặt lại mật khẩu</button>
            <button type="button" class="gray" id="btnChangePass">Đổi mật khẩu</button>
            <button type="button" class="gray" id="btnCloseDetail">Đóng</button>
        </div>
    </dialog>

    <script type="module" src="../assets/js/users.js"></script>
</body>

</html>
